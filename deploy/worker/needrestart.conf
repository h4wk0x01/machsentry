# Installed by deploy/worker/bootstrap.sh as
# /etc/needrestart/conf.d/machsentry-worker.conf.
# Unattended package upgrades must not restart Docker or the worker units:
# with live-restore off, a Docker restart kills the running analysis
# container. They pick up new libraries at the next stop/start of the worker.
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;
$nrconf{override_rc}{qr(^machsentry-)} = 0;

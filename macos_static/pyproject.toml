[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "machsentry"
version = "0.4.0"
description = "Static macOS malware reports over REA/Ghidra MCP Evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==2.3.0", "capstone==5.0.9", "yara-python==4.5.4", "jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/h4wk0x01/machsentry"

[project.scripts]
machsentry = "machsentry.cli:main"

[tool.setuptools.packages.find]
include = ["machsentry*"]

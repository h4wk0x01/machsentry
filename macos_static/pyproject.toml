[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facemessenger"
version = "0.2.0"
description = "Offline, evidence-linked static analysis of macOS Mach-O malware"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["lief==1.0.0", "capstone==5.0.9", "yara-python==4.5.4"]

[project.urls]
Repository = "https://github.com/h4wk0x01/facemessenger"

[project.scripts]
facemessenger = "facemessenger.cli:main"

[tool.setuptools.packages.find]
include = ["facemessenger*"]

name: facemessenger

on:
  pull_request:
    paths: ["macos_static/**", ".github/workflows/facemessenger.yml"]
  push:
    paths: ["macos_static/**", ".github/workflows/facemessenger.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-worker:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install ./macos_static
      - run: python -m unittest discover -s macos_static/tests -v

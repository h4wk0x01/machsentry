name: MachSentry

on:
  pull_request:
    paths:
      [
        "macos_static/**",
        "scripts/*machsentry*",
        "src/ghidra/**",
        "src/artifacts/MachOSlice*",
        ".github/workflows/machsentry.yml",
      ]
  push:
    paths:
      [
        "macos_static/**",
        "scripts/*machsentry*",
        "src/ghidra/**",
        "src/artifacts/MachOSlice*",
        ".github/workflows/machsentry.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-worker:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install ./macos_static
      - run: python -m unittest discover -s macos_static/tests -v
      - run: python -m unittest discover -s scripts -p test_machsentry_setup.py -v

  real-ghidra:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      GHIDRA_HEADLESS_MAXMEM: "512M"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prepare and select the project-local runtimes
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          environment = dict(os.environ)
          environment.pop("JAVA_HOME", None)
          subprocess.run([sys.executable, "scripts/machsentry_setup.py"], env=environment, check=True)
          configuration = json.loads(Path(".tools/runtime.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in configuration["environment"].items():
                  output.write(f"{name}={value}\n")
      - run: python scripts/verify-machsentry-ghidra.py --output reports/ghidra-verification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ghidra-evidence-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
